<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Daily Challenges</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>JavaScript Challenges Workbench</h1>

    <!-- Day 1: Color Changer -->
    <section>
        <h2>Day 1: Color Changer</h2>
        <button id="colorBtn">Change Heading Colors</button>
        <h3>Testing Heading Level 3</h3>
    </section>

    <!-- Day 2: Dynamic Element Creator -->
    <section>
        <h2>Day 2: Paragraph Creator</h2>
        <button id="addParaBtn">Add Paragraph</button>
        <div id="paraContainer"></div>
    </section>

    <!-- Day 3: Image Remover -->
    <section>
        <h2>Day 3: Image Toggle</h2>
        <button id="toggleImgBtn">Hide Images</button>
        <br>
        <img src="https://picsum.photos" alt="Sample 1">
        <img src="https://picsum.photos" alt="Sample 2">
    </section>

    <!-- Day 4: Content Copier -->
    <section>
        <h2>Day 4: Content Copier</h2>
        <div id="source" draggable="true" style="border: 2px dashed #888; padding: 10px; margin-bottom: 10px; background: #eee; color: #000;">
            <strong>Drag me</strong> or use the button below!
        </div>
        <div id="target" style="border: 2px solid #00f; min-height: 50px; padding: 10px; margin-bottom: 10px;">
            <em>Drop zone / Destination...</em>
        </div>
        <button id="copyBtn">Copy Content via Button</button>
    </section>

    <!-- Day 5: Dark Mode Toggle -->
    <section>
        <h2>Day 5: Theme Modifier</h2>
        <button id="themeToggleBtn">Toggle Dark Mode</button>
    </section>
    <script src="script.js"></script>
</body>
</html>
